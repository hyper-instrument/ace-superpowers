# 万里长江站点 nginx 配置片段 —— 二选一，都不影响机器上已有的其他站点/服务
#
# ── 方式 A：挂在现有站点的子路径 /yangtze/ 下 ─────────────────────
# 把下面的 location 块复制进你现有的 server {} 里即可（不要整个文件 include 进 http{}）：
#
#   location /yangtze/ {
#       alias /srv/yangtze/;
#       try_files $uri $uri/ /yangtze/index.html;
#   }
#
# 然后: sudo nginx -t && sudo systemctl reload nginx
# 访问: http://<机器地址>/yangtze/
#
# ── 方式 B：独立端口（完全隔离），整个文件放到 /etc/nginx/conf.d/yangtze.conf ──

server {
    listen 8391;
    server_name _;

    root /srv/yangtze;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带内容哈希）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# 然后: sudo nginx -t && sudo systemctl reload nginx
# 访问: http://<机器地址>:8391/
